name: CI/CD Pipeline

on:
  push:
    branches: [main]        # runs every time you push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. install node and test
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install


      # 3. build docker image and push to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t pratikganjale/basic-app:latest .
          docker push pratikganjale/basic-app:latest
    

